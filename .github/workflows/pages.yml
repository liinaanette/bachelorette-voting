name: Deploy to GitHub Pages

# Publishes the repo root as-is — there's nothing to build.
#
# One-time setup, needed before the first deploy can succeed:
#   repo Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# (configure-pages has an `enablement: true` option meant to do this
# automatically, but creating a Pages site is refused to GITHUB_TOKEN —
# "Resource not accessible by integration" — so it has to be done by hand.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
